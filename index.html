<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Space Cat Games - Single File</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: sans-serif;
      background: #0f0f14;
      color: white;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .game {
      background: #1a1a22;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      text-decoration: none;
      color: white;
      transition: transform 0.1s ease, background 0.2s;
    }

    .game:hover {
      background: #262633;
      transform: scale(1.05);
    }

    .game img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
      background: #000;
    }

    .title {
      margin-top: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<h1>Space Cat Games - Single File</h1>
<p><em>It is currenly normal for games to be missing images.</em></p>
<p></p>
<div id="games" class="grid"></div>

<script>
  const API_URL = "https://spacecatgame.netlify.app/api/games.json";
  const container = document.getElementById("games");

  // Preload image (forces browser to download/cache it)
  function preloadImage(src) {
    const img = new Image();
    img.src = src;
  }

  // Create a game card
  function createGameCard(game) {
    const a = document.createElement("a");
    a.className = "game";

    // Convert relative URLs to absolute URLs
    let gameUrl = game.url;
    if (gameUrl) {
      // If URL is relative (doesn't start with http:// or https://), make it absolute
      if (!gameUrl.startsWith("http://") && !gameUrl.startsWith("https://")) {
        // Assuming relative paths are from the spacecatgame API domain
        gameUrl = "https://spacecatgame.netlify.app" + (gameUrl.startsWith("/") ? gameUrl : "/" + gameUrl);
      }

      // Use CORS proxy for blocked URLs
      if (gameUrl.includes("w3schools.com") || gameUrl.includes("edgesuite")) {
        // Use public CORS proxy service (allorigins.win - still active and reliable)
        gameUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(gameUrl);
      }
    }

    // Use onClick to prevent default file:// resolution
    a.href = "#";
    a.onclick = (e) => {
      e.preventDefault();
      if (gameUrl) {
        window.open(gameUrl, "_blank");
      }
    };

    const img = document.createElement("img");
    img.src = game.img || "/images/noimg.png";
    img.alt = game.alt || game.title;

    const title = document.createElement("div");
    title.className = "title";
    title.textContent = game.title;

    a.appendChild(img);
    a.appendChild(title);

    return a;
  }

  // Load games
  async function loadGames() {
    try {
      const res = await fetch(API_URL);
      const data = await res.json();

      if (!data.games) throw new Error("Invalid API format");

      data.games.forEach(game => {
        // preload image (download/cache)
        if (game.img) preloadImage(game.img);

        const card = createGameCard(game);
        container.appendChild(card);
      });

    } catch (err) {
      console.error(err);
      container.innerHTML = "<p>Failed to load games.</p>";
    }
  }

  loadGames();
</script>

</body>
</html>
